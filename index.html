<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打字游戏 · Vibe Game</title>
<style>
  :root { --bg: #000; --fg: #fff; --hit: #f38ba8; --ok: #a6e3a1; --gold: #facc15; --dim: #3a3352; }
  body { font-family: "Courier New", monospace; font-weight: bold; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; max-width: 560px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  .win { border: 4px double var(--fg); padding: 8px 12px; width: 100%; box-sizing: border-box; background: #000; }
  .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
  .bar b { color: var(--gold); font-variant-numeric: tabular-nums; }
  #combo { color: var(--hit); min-width: 4.5em; text-align: right; }
  #scene { image-rendering: pixelated; image-rendering: crisp-edges; display: block; border: 4px double var(--fg); }
  #word { font-size: 2.2rem; letter-spacing: 3px; text-align: center; min-height: 2.6rem; text-shadow: 2px 2px 0 var(--dim); }
  #word .ok { color: var(--ok); }
  #word.bad { animation: bad .15s; }
  @keyframes bad { 0%, 100% { color: var(--hit); } 25% { transform: translateX(-4px); color: var(--hit); } 75% { transform: translateX(4px); color: var(--hit); } }
  #tbar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; width: 100%; height: 10px; }
  #tbar i { background: #222; }
  #tbar i.on { background: var(--ok); }
  #tbar.mid i.on { background: var(--gold); }
  #tbar.low i.on { background: var(--hit); }
  #badges { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 1.4rem; }
  #badges button { font-size: inherit; padding: 0 .2rem; border: 0; opacity: .35; filter: grayscale(1); }
  #badges button.got { opacity: 1; filter: none; }
  #badges button:hover { background: none; color: inherit; }
  #badges button:focus-visible { outline: 2px solid var(--gold); background: none; }
  #worlds { display: flex; gap: 6px; width: 100%; }
  #worlds[hidden] { display: none; }
  #worlds button { flex: 1; padding: .3rem 0; line-height: 1.15; font-size: 1.3rem; }
  #worlds button small { display: block; font-size: .7rem; }
  #worlds button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  #worlds button[aria-pressed="true"]:hover, #worlds button[aria-pressed="true"]:focus-visible { background: var(--gold); color: #000; }
  input { font: inherit; font-size: 1.4rem; padding: .4rem; text-align: center; border: 4px double var(--fg); background: #000; color: var(--fg); width: 100%; box-sizing: border-box; }
  button { font: inherit; font-size: 1.2rem; padding: .5rem 1.5rem; border: 4px double var(--fg); background: #000; color: var(--fg); cursor: pointer; }
  button:hover, button:focus-visible { background: var(--fg); color: #000; }
  button:disabled { opacity: .4; cursor: default; }
  button:disabled:hover { background: #000; color: var(--fg); }
  #snd { font-size: 1rem; padding: 0 .5rem; border-width: 3px; }
  form { width: 100%; margin: 0; }
  #hint { font-size: .85rem; color: #a39cbd; margin-top: -4px; }
  #start[hidden] + #hint { display: none; }
  @media not ((hover: hover) and (pointer: fine)) { #hint { display: none; } } /* touch screens have no keyboard to press */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { #word.bad { animation: none; color: var(--hit); } }
  /* phones / keyboard open: tighter spacing so scene, word and input stay visible */
  @media (max-height: 640px), (max-width: 480px) {
    main { gap: 6px; padding: 8px 16px; }
    .win { padding: 5px 8px; font-size: .85rem; }
    #word { font-size: 1.6rem; min-height: 2rem; }
    input { font-size: 1.2rem; padding: .3rem; }
  }
</style>
<meta name="vg:version" content="3.0.0">
<script src="/nav.js" defer></script>
</head>
<body>
<main>
  <div class="win bar">
    <span><span data-i18n="stage">STAGE</span> <b id="stage">1-1</b></span>
    <span><span data-i18n="time">TIME</span> <b id="time">0.0</b></span>
    <span><span data-i18n="best">BEST</span> <b id="best">--</b></span>
    <span id="combo"></span>
    <button id="snd" type="button" aria-pressed="true">♪</button>
  </div>
  <canvas id="scene" role="img"></canvas>
  <div id="word"></div>
  <div id="tbar" aria-hidden="true"></div>
  <form id="form"><input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="en" enterkeyhint="done" disabled></form>
  <div class="win" id="msg" aria-live="polite"></div>
  <span class="sr" id="say" aria-live="polite"></span>
  <div id="worlds" role="group"></div>
  <button id="start" type="button" data-i18n="start">Start</button>
  <span id="hint"></span>
  <div class="win" id="badges"></div>
</main>
<script>
const $ = id => document.getElementById(id);

/* ---------- words ---------- */

  'dragon wizard castle shield potion knight forest silver hammer spirit goblin dagger temple bridge candle shadow throne island meadow scroll mirror golden falcon winter portal riddle cavern prince beacon jester kraken squire canyon banner goblet bandit cobweb wraith tunnel spooky beetle scarab chisel lizard rubble cactus ' +
  'monster thunder dungeon crystal warrior phoenix kingdom lantern emerald diamond unicorn enchant pegasus sorcery mystery journey rainbow volcano pyramid fortune harvest courage victory glacier tornado alchemy compass warlock boulder warband phantom haunted ghostly outpost trinket moonlit lookout rampart mineral gremlin pumpkin bonfire drummer ' +
  'blizzard treasure sorcerer champion guardian mountain princess fireball sapphire amethyst catapult skeleton talisman obsidian midnight wildfire darkness mushroom magician gauntlet minstrel basilisk catacomb gargoyle scorpion spectral cauldron moonbeam sentinel fortress ironclad skeletal crossbow trapdoor boneyard palisade stampede ' +
  'adventure legendary labyrinth explosion invisible moonlight starlight nightmare spellbook enchanted chainmail sorceress waterfall hourglass dragonfly moonstone firestorm sunflower sandstorm tombstone graveyard nightfall nocturnal spiderweb candlelit parchment scavenger skeletons scarecrow quicksand firelight rockslide ' +
  'drawbridge spellbound invincible mysterious stronghold watchtower adventurer knighthood blacksmith lighthouse friendship chandelier gravestone apparition underworld nightshade torchlight sandcastle tumbleweed earthquake stalagmite crossroads masquerade ' +
  'cobblestone candlelight spellcaster thunderbolt enchantress candlestick rattlesnake nightingale trailblazer everlasting mountaintop thunderclap').split(' ');

/* ---------- worlds: a run is one world of 5 levels with 3 hearts; beating its boss unlocks the next ---------- */
// time per word = base + per * word length (seconds). A boss enrages at rage.at HP: longer words, and every
// rage.every-th word is its special word (spell: own limit and damage multiplier, colour and name)
const WORLDS = [
  { name: 'w1', win: 'win', levels: [
    { name: 'st1', mon: 'slime', color: '#4ade80', min: 3, max: 4, hp: 20,  base: 3,   per: 1.4, scene: 'meadow' },
    { name: 'st2', mon: 'slime', color: '#fb923c', min: 4, max: 5, hp: 30,  base: 2.5, per: 1.1, scene: 'desert' },
    { name: 'st3', mon: 'slime', color: '#cbd5e1', min: 5, max: 6, hp: 40,  base: 2,   per: 0.8, scene: 'cave', shine: true },
    { name: 'st4', mon: 'slime', color: '#a855f7', min: 6, max: 7, hp: 52,  base: 1.5, per: 0.7, scene: 'forest', eye: '#d9f99d' },
    { name: 'st5', mon: 'slimeKing', color: '#7f1d1d', min: 7, max: 9, hp: 100, base: 1.5, per: 0.6, scene: 'castle', boss: true,
      rage: { at: 50, min: 8, max: 10, base: 1.5, per: 0.55, every: 3, spell: { key: 'dark', color: '#c084fc', min: 7, max: 8, limit: 5, mult: 2 } } },
  ] },
  { name: 'w2', win: 'win2', levels: [
    { name: 'm.goblin', mon: 'goblin', min: 4, max: 5, hp: 30, base: 2.5, per: 1.0,  scene: 'trail' },
    { name: 'm.scout',  mon: 'scout',  min: 5, max: 6, hp: 40, base: 2,   per: 0.75, scene: 'camp' },
    { name: 'm.shaman', mon: 'shaman', min: 6, max: 7, hp: 52, base: 1.5, per: 0.65, scene: 'sunset' },
    { name: 'm.orc',    mon: 'orc',    min: 7, max: 8, hp: 64, base: 1.4, per: 0.58, scene: 'pass' },
    { name: 'm.goblinKing', mon: 'goblinKing', min: 8, max: 9, hp: 120, base: 1.3, per: 0.55, scene: 'fort', boss: true,
      rage: { at: 60, min: 8, max: 10, base: 1.2, per: 0.5, every: 2, spell: { key: 'drum', color: '#fb923c', min: 5, max: 6, limit: 3.5, mult: 2 } } },
  ] },
  { name: 'w3', win: 'win3', levels: [
    { name: 'm.skeleton', mon: 'skeleton', min: 5, max: 6,  hp: 40, base: 2,   per: 0.7,  scene: 'graveyard' },
    { name: 'm.ghost',    mon: 'ghost',    min: 6, max: 7,  hp: 56, base: 1.5, per: 0.6,  scene: 'hollow' },
    { name: 'm.mummy',    mon: 'mummy',    min: 7, max: 9,  hp: 72, base: 1.3, per: 0.55, scene: 'crypt' },
    { name: 'm.knight',   mon: 'knight',   min: 8, max: 10, hp: 88, base: 1.3, per: 0.52, scene: 'catacomb' },
    { name: 'm.boneKing', mon: 'boneKing', min: 9, max: 10, hp: 140, base: 1.4, per: 0.5, scene: 'throne', boss: true,
      rage: { at: 70, min: 9, max: 11, base: 1.2, per: 0.48, every: 4, spell: { key: 'curse', color: '#5eead4', min: 9, max: 10, limit: 6, mult: 3 } } },
  ] },
];
const COMBO_HEAL = 8, CRIT = 1.5;
// achievements, checked once per run; r = { win, t, hearts, stage, maxCombo, acc, world, hurts }
const BADGES = [
  { id: 'hunter',   icon: '🗡', test: r => r.stage >= 1 },
  { id: 'veteran',  icon: '🛡', test: r => r.stage >= 4 },
  { id: 'hero',     icon: '👑', test: r => r.win && r.world === 0 },
  { id: 'flawless', icon: '💎', test: r => r.win && r.hurts === 0 },
  { id: 'speedy',   icon: '⚡', test: r => r.win && r.world === 0 && r.t < 75 },
  { id: 'combo',    icon: '🔥', test: r => r.maxCombo >= 20 },
  { id: 'sharp',    icon: '🎯', test: r => r.win && r.acc >= 95 },
  { id: 'world2',   icon: '⚔', test: r => r.win && r.world === 1 },
  { id: 'world3',   icon: '🏆', test: r => r.win && r.world === 2 },
];

/* ---------- UI language: zh* browsers get Chinese, everyone else English. The words stay English. ---------- */
const STR = {
  en: { title: 'Typing Game · Vibe Game', stage: 'STAGE', time: 'TIME', best: 'BEST', start: 'Start', again: 'Play again', next: 'Next world',

    st1: 'Slime', st2: 'She-Slime', st3: 'Metal Slime', st4: 'Night Slime', st5: 'Demon King Slime',
    'm.goblin': 'Goblin', 'm.scout': 'Goblin Scout', 'm.shaman': 'Goblin Shaman', 'm.orc': 'Orc Brute', 'm.goblinKing': 'Goblin King',

    intro: 'Type the word to attack. Wrong letters are blocked. Too slow = lose a heart.',
    appear: 'Here comes the {n}! (HP {hp})', bossAppear: 'BOSS! The {n} appears! (HP {hp})',
    dmg: '{n} takes {d} damage!', crit: 'Critical hit! {n} takes {d} damage!', slow: 'Too slow! The {n} hits you!',
    rage: 'The {n} is enraged!', heal: 'Combo {d}! A heart comes back.',
    'spell.dark': 'Dark Spell! Break it in {d} seconds!', 'broken.dark': 'Spell broken! {d} damage!',
    'spell.drum': 'War Drum! Beat it in {d} seconds!', 'broken.drum': 'Drum broken! {d} damage!',
    'spell.curse': 'Curse! Lift it in {d} seconds!', 'broken.curse': 'Curse lifted! {d} damage!',
    win: 'You defeated the Demon King Slime in {d}s! The kingdom is saved!',
    win2: 'You defeated the Goblin King in {d}s! The canyon is safe!',
    win3: 'You defeated the Bone King in {d}s! The crypt sleeps again!',
    lose: 'You have been defeated at stage {d}.', stats: '{w} WPM · {a}% accuracy · max combo {c}.', newBest: 'New best!',
    unlock: 'World {w} unlocked!', allClear: 'All three worlds cleared!',
    sep: ', ', comma: ', ', gap: ' ', worlds: 'Choose a world', world: 'World {w}: {n}', lockedW: 'LOCKED', sec: '{d}s',
    lockedMsg: 'World {w} is locked. Beat the World {p} boss first.', pickMsg: 'World {w}: {n}. Best {b}.',
    newBadge: 'New badge: {n}!', combo: 'x{d}', anyKey: 'or press any key', anyKey2: 'or press any key · ← → picks a world',
    soundOn: 'Sound on', soundOff: 'Sound off',
    hearts: '{d} of 3 hearts', scene: 'Stage {s}: {n}, HP {hp}. {h}.', input: 'Type the word', badges: 'Badges', locked: '(locked)',
    'b.hunter': 'Monster Hunter: Defeat your first monster', 'b.veteran': 'Veteran: Reach a boss', 'b.hero': 'Hero: Defeat the Demon King Slime',
    'b.flawless': 'Flawless: Clear a world without losing a heart', 'b.speedy': 'Speedrunner: Clear World 1 in under 75 seconds',
    'b.combo': 'Combo Master: Reach a 20 combo', 'b.sharp': 'Sharpshooter: Clear a world with 95% accuracy or better',
    'b.world2': 'Conqueror: Defeat the Goblin King', 'b.world3': 'Legend: Defeat the Bone King' },
  zh: { title: '打字游戏 · Vibe Game', stage: '关卡', time: '时间', best: '最佳', start: '开始', again: '再来一局', next: '下一个世界',
    w1: '史莱姆原野', w2: '哥布林峡谷', w3: '月光墓穴',
    st1: '史莱姆', st2: '橙史莱姆', st3: '金属史莱姆', st4: '暗夜史莱姆', st5: '魔王史莱姆',
    'm.goblin': '哥布林', 'm.scout': '哥布林斥候', 'm.shaman': '哥布林巫师', 'm.orc': '兽人蛮兵', 'm.goblinKing': '哥布林大王',
    'm.skeleton': '骷髅兵', 'm.ghost': '小幽灵', 'm.mummy': '木乃伊', 'm.knight': '幽灵骑士', 'm.boneKing': '骷髅王',
    intro: '看词打词，打完自动出刀。打错的字母打不进去。太慢扣一颗心。',
    appear: '{n}出现了！（血量 {hp}）', bossAppear: '魔王来了！{n}出现了！（血量 {hp}）',
    dmg: '{n}受到 {d} 点伤害！', crit: '暴击！{n}受到 {d} 点伤害！', slow: '太慢了，{n}打中了你！',
    rage: '{n}发怒了！', heal: '连击 {d}，回一颗心。',
    'spell.dark': '黑暗咒语！{d} 秒内打破它！', 'broken.dark': '咒语破了！造成 {d} 点伤害！',
    'spell.drum': '战鼓擂响！{d} 秒内打断它！', 'broken.drum': '战鼓破了！造成 {d} 点伤害！',
    'spell.curse': '诅咒！{d} 秒内解开它！', 'broken.curse': '诅咒解开了！造成 {d} 点伤害！',
    win: '用时 {d} 秒打倒魔王史莱姆，王国得救了！',
    win2: '用时 {d} 秒打倒哥布林大王，峡谷太平了！',
    win3: '用时 {d} 秒打倒骷髅王，墓穴又安静了！',
    lose: '你在第 {d} 关倒下了。', stats: '每分钟 {w} 词 · 准确率 {a}% · 最高连击 {c}。', newBest: '新纪录！',
    unlock: '世界 {w} 解锁了！', allClear: '三个世界都通关了！',
    sep: '、', comma: '，', gap: '', worlds: '选择世界', world: '世界 {w}：{n}', lockedW: '未解锁', sec: '{d} 秒',
    lockedMsg: '世界 {w} 还没解锁，先打倒世界 {p} 的魔王。', pickMsg: '世界 {w}：{n}。最佳 {b}。',
    newBadge: '获得徽章：{n}！', combo: '连击 {d}', anyKey: '或按任意键', anyKey2: '或按任意键，← → 选世界',
    soundOn: '声音开', soundOff: '声音关',
    hearts: '还剩 {d} 颗心', scene: '第 {s} 关：{n}，血量 {hp}。{h}。', input: '输入单词', badges: '徽章', locked: '（未获得）',
    'b.hunter': '怪物猎人：打倒第一只怪物', 'b.veteran': '老兵：打到魔王', 'b.hero': '勇者：打倒魔王史莱姆',
    'b.flawless': '无伤：一颗心不丢打通一个世界', 'b.speedy': '速通：75 秒内打通世界 1',
    'b.combo': '连击大师：连击达到 20', 'b.sharp': '神射手：准确率 95% 以上打通一个世界',
    'b.world2': '征服者：打倒哥布林大王', 'b.world3': '传说：打倒骷髅王' },
};
// ?lang=en / ?lang=zh forces a language and ?world=2 opens a world, for testing; nothing is saved, and vibe.lang is never touched
const params = new URLSearchParams(location.search);
const LANG = (params.get('lang') || (navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
const t = (k, v = {}) => (STR[LANG][k] ?? STR.en[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v[n]);
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.title = t('title');
document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
$('input').setAttribute('aria-label', t('input'));
$('badges').setAttribute('aria-label', t('badges'));
$('worlds').setAttribute('aria-label', t('worlds'));

/* ---------- saves ---------- */
// storage keys use the URL slug; copy over records saved under the old /arthur/ address once
try {
  for (const k of ['bestTime', 'badges']) {
    const old = localStorage.getItem('arthur.' + k);
    if (old !== null && localStorage.getItem('typing-game.' + k) === null) localStorage.setItem('typing-game.' + k, old);
  }
} catch {}
let badges = [];
try { const b = JSON.parse(localStorage.getItem('typing-game.badges')); if (Array.isArray(b)) badges = b; } catch {}
// typing-game.save.v1 = { unlocked: worlds open (1..3), world: last picked (0..2), best: [seconds or null per world] }.
// bestTime2 (v2, the old 5-stage run) is World 1's best; it is still written for World 1 so a rollback keeps working.
let save = { unlocked: 1, world: 0, best: [null, null, null] };
try { const s = JSON.parse(localStorage.getItem('typing-game.save.v1')); if (s && Array.isArray(s.best)) save = { ...save, ...s }; } catch {}
if (save.best[0] == null) { try { save.best[0] = parseFloat(localStorage.getItem('typing-game.bestTime2')) || null; } catch {} }
if (badges.includes('hero')) save.unlocked = Math.max(save.unlocked, 2);
save.unlocked = Math.min(Math.max(1, save.unlocked | 0), WORLDS.length);
const testWorld = Math.min(WORLDS.length, +params.get('world') || 0);
const unlocked = () => Math.max(save.unlocked, testWorld);
// with ?world=N nothing is written, so testing on a real profile doesn't change it
const keep = (k, v) => { if (!testWorld) try { localStorage.setItem(k, v); } catch {} };
const store = () => keep('typing-game.save.v1', JSON.stringify(save));
let sel = Math.min(Math.max(0, save.world | 0), unlocked() - 1);
if (testWorld) sel = testWorld - 1;
const fmt = s => s ? t('sec', { d: s.toFixed(1) }) : '--';
const showBest = () => $('best').textContent = save.best[world] ? save.best[world].toFixed(1) : '--';

const showBadges = () => $('badges').innerHTML = BADGES.map(b => {
  const got = badges.includes(b.id), label = t('b.' + b.id);
  return `<button type="button" class="${got ? 'got' : ''}" data-b="${b.id}" title="${label}" aria-label="${label}${got ? '' : ' ' + t('locked')}">${b.icon}</button>`;
}).join('');
showBadges();
// tap a badge to read it (title tooltips don't work on touch screens)
$('badges').onclick = e => { const b = e.target.closest('[data-b]'); if (b && !running) say(t('b.' + b.dataset.b)); };
// saves and returns newly earned badges
function award(r) {
  const fresh = BADGES.filter(b => !badges.includes(b.id) && b.test(r));
  if (!fresh.length) return [];
  badges.push(...fresh.map(b => b.id));
  keep('typing-game.badges', JSON.stringify(badges));
  showBadges();
  return fresh.map(b => b.icon + ' ' + t('b.' + b.id).split(/[:：]/)[0]);
}

/* ---------- sound: chiptune blips made with Web Audio, no files ---------- */
let muted = false, ac, master;
try { muted = localStorage.getItem('typing-game.sound') === 'off'; } catch {}
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ac = new AC(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f0, f1, dur, type = 'square', vol = .12, delay = 0) {
  const a = audio(); if (!a) return;
  const at = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, at);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);

    brickWall('#2e3440', '#3b4252');
    rect(bg, 50, 16, 12, 24, '#111827'); disc(bg, 56, 16, 6, '#111827');
    sprite(bg, mirror(COBWEB), { w: '#cbd5e1' }, 106, 0); // top-right only: the hearts sit top-left
    checker('#1f2430', '#2b3240');
    [6, 36, 64].forEach(x => sprite(bg, CANDLE, { c: '#f5f5f4', h: '#a16207' }, x, 35));
  },
  catacomb() {
    rect(bg, 0, 0, W, 40, '#3b2f4a');
    [4, 20, 36, 52, 104].forEach(x => { rect(bg, x, 12, 8, 10, '#1c1424'); disc(bg, x + 4, 12, 4, '#1c1424'); rect(bg, x + 3, 19, 2, 1, '#e7e5e4'); });
    rect(bg, 34, 22, 1, 6, '#1c1424'); rect(bg, 78, 22, 1, 6, '#1c1424');
    rect(bg, 0, 40, W, 12, '#2a2236'); for (let y = 43; y < H; y += 3) rect(bg, 0, y, W, 1, '#1c1424');
  },
  throne(rage) {
    brickWall(rage ? '#4a044e' : '#134e4a', rage ? '#701a75' : '#115e59');
    rect(bg, 70, 12, 32, 32, '#3b0764'); rect(bg, 70, 12, 32, 1, '#facc15'); rect(bg, 70, 12, 2, 32, '#581c87'); rect(bg, 100, 12, 2, 32, '#581c87');
    checker('#0f2e2c', '#1a4a46');
    sprite(bg, BRAZIER, { h: '#57534e' }, 28, 35); sprite(bg, BRAZIER, { h: '#57534e' }, 58, 35);
  },
};
// animated bits drawn every frame: flames (top pixel x, y) in [body, tip] colours, and blinking motes
const FIRE = ['#f97316', '#fde047'];
const MOTES = [[14, 30], [44, 34], [66, 26], [90, 31], [104, 37]];
const SCENE_FX = {
  cave: { flames: [[6, 19]] }, castle: { flames: [[34, 19], [78, 19]] }, forest: { motes: '#d9f99d' },
  camp: { flames: [[50, 39]] }, fort: { flames: [[34, 19], [78, 19]] },
  hollow: { motes: '#a5f3fc' }, crypt: { flames: [[7, 32], [37, 32], [65, 32]] },
  catacomb: { flames: [[34, 19], [78, 19]], fire: ['#38bdf8', '#e0f2fe'] },
  throne: { flames: [[30, 32], [60, 32]], fire: ['#4ade80', '#bbf7d0'], rageFire: ['#e879f9', '#f5d0fe'] },
};
// 3x5 pixel font for the floating numbers
const FONT = { 0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001',
  5: '111100111001111', 6: '111100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001111',
  '-': '000000111000000', '+': '000010111010000', C: '111100100100111', R: '110101110101101', I: '111010010010111', T: '111010010010010' };
function text(c, str, x, y, col) {
  [...str].forEach((ch, i) => {
    if (ch === '♥') return sprite(c, HEART, { k: col }, x + i * 4, y);
    const m = FONT[ch]; if (!m) return;
    for (let k = 0; k < 15; k++) if (m[k] === '1') { px(c, x + i * 4 + k % 3 + 1, y + (k / 3 | 0) + 1, '#000'); px(c, x + i * 4 + k % 3, y + (k / 3 | 0), col); }
  });
}

/* ---------- game state ---------- */
let world = sel, stage = 0, hp = 0, hearts = 3, hurts = 0, combo = 0, maxCombo = 0, keys = 0, typos = 0, good = 0;
let word = '', done = '', clean = true, wordStart = 0, limit = 1, spell = false, raged = false, rageWords = 0;
let playing = false, running = false, t0 = 0, pausedTotal = 0, pausedAt = 0, lastWarn = -1, runId = 0;
let bag = [], bagKey = '', used = new Set();
let fx = {}, floats = [], dead = false, played = false, nextWorld = -1;
const now = () => performance.now();
const LV = () => WORLDS[world].levels;
const S = () => LV()[stage];
const name = () => t(S().name);
const label = () => (world + 1) + '-' + (stage + 1);
const say = s => $('msg').textContent = s;
function palOf(s) {
  const m = MONSTERS[s.mon];
  if (m.pal) return raged && m.rage ? { ...m.pal, ...m.rage } : m.pal;
  return { k: '#111', m: s.color, w: raged ? '#fde047' : s.eye || '#fff', y: '#facc15', r: raged ? '#fde047' : '#ef4444' };
}

// shuffle bag per length band; a word is used at most once per run, and never twice in a row
function drawWord(min, max) {
  const k = min + '-' + max;
  if (k !== bagKey || !bag.length) {
    bagKey = k;
    const pool = WORDS.filter(w => w.length >= min && w.length <= max);
    bag = pool.filter(w => !used.has(w));
    if (bag.length < 4) bag = pool.filter(w => w !== word);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [bag[i], bag[j]] = [bag[j], bag[i]]; }
  }
  const w = bag.pop(); used.add(w); return w;
}
function nextWord() {
  const s = S();
  spell = false;
  if (s.boss && raged && ++rageWords % s.rage.every === 0) {
    spell = true; word = drawWord(s.rage.spell.min, s.rage.spell.max); limit = s.rage.spell.limit;
    say(t('spell.' + s.rage.spell.key, { d: limit }));
  } else {
    const r = s.boss && raged ? s.rage : s;
    word = drawWord(r.min, r.max); limit = r.base + r.per * word.length;
  }
  done = ''; clean = true; wordStart = now(); lastWarn = -1;
  $('input').value = '';
  renderWord();
  $('say').textContent = word;
}
function renderWord() {
  $('word').style.color = spell ? S().rage.spell.color : '';
  $('word').innerHTML = `<span class="ok">${done}</span>${word.slice(done.length)}`;
}
function hud() {
  $('stage').textContent = label();
  $('combo').textContent = combo >= 2 ? t('combo', { d: combo }) : '';
  cv.setAttribute('aria-label', t('scene', { s: label(), n: name(), hp: hp || S().hp, h: t('hearts', { d: hearts }) }));
}
// freeze both clocks for ms (level clear, boss intro, rage, hit-stop), then run fn
function pause(ms, fn) {
  playing = false; pausedAt = now();
  const id = runId;
  setTimeout(() => {
    if (id !== runId || !running) return;
    pausedTotal += now() - pausedAt; pausedAt = 0; playing = true; fn();
    if (document.hidden && playing) { playing = false; pausedAt = now(); fx.away = true; }
  }, ms);
}
const runTime = () => ((pausedAt || now()) - t0 - pausedTotal) / 1000;

function loadStage() {
  const s = S();
  hp = s.hp; raged = false; rageWords = 0; dead = false; fx.kill = 0;
  SCENES[s.scene](false); hud();
  word = ''; done = ''; renderWord();
  if (s.boss) { sfx('boss'); fx.shake = now(); say(t('bossAppear', { n: name(), hp: s.hp })); pause(1200, nextWord); }
  else { say(t('appear', { n: name(), hp: s.hp })); nextWord(); }
}
function hit() {
  const s = S(), crit = !spell && clean && (now() - wordStart) / 1000 < limit / 2;
  let d = word.length;
  if (spell) d *= s.rage.spell.mult; else if (crit) d = Math.ceil(d * CRIT);
  hp = Math.max(0, hp - d);
  if (clean) maxCombo = Math.max(maxCombo, ++combo);
  fx.atk = now();
  floats.push({ str: '-' + d, x: 84, y: s.boss ? 12 : 24, col: crit || spell ? '#fb923c' : '#facc15', t: now() });
  if (crit) floats.push({ str: 'CRIT', x: 80, y: s.boss ? 4 : 16, col: '#fb923c', t: now() });
  sfx(crit || spell ? 'crit' : 'hit');
  say(spell ? t('broken.' + s.rage.spell.key, { d }) : t(crit ? 'crit' : 'dmg', { n: name(), d }));
  if (clean && combo % COMBO_HEAL === 0 && hearts < 3) {
    hearts++; setTimeout(() => sfx('heal'), 150);
    floats.push({ str: '+♥', x: 18, y: 22, col: '#a6e3a1', t: now() });
    say(t('heal', { d: combo }));
  }
  hud();
  word = ''; done = ''; $('input').value = '';
  if (hp <= 0) {
    fx.kill = now(); dead = true; spell = false; renderWord();
    if (stage === LV().length - 1) return pause(900, () => end(true));
    setTimeout(() => sfx('clear'), 120);
    return pause(900, () => { stage++; loadStage(); });
  }
  if (s.boss && !raged && hp <= s.rage.at) {
    raged = true; rageWords = 0; SCENES[s.scene](true); fx.shake = now();
    setTimeout(() => sfx('boss'), 150); say(t('rage', { n: name() })); spell = false; renderWord();
    return pause(1200, nextWord);
  }
  pause(crit ? 100 : 60, nextWord); // short hit-stop so the blow lands
}
// lose a heart (timer ran out); ends the run at zero
function hurt() {
  hearts--; hurts++; combo = 0; fx.hurt = fx.shake = now(); sfx('hurt'); hud();
  floats.push({ str: '-♥', x: 18, y: 22, col: '#f38ba8', t: now() });
  say(t('slow', { n: name() }));
  if (hearts <= 0) return end(false);
  nextWord();
}
function end(win) {
  playing = running = false; pausedAt = 0;
  const tt = (now() - t0 - pausedTotal) / 1000;
  $('time').textContent = tt.toFixed(1);
  $('input').disabled = true;
  word = ''; done = ''; spell = false; renderWord();
  const acc = keys ? Math.round(100 * (keys - typos) / keys) : 0;
  const wpm = tt > 0 ? Math.round(good / 5 / (tt / 60)) : 0;
  let m = (win ? t(WORLDS[world].win, { d: tt.toFixed(1) }) : t('lose', { d: label() })) + t('gap') + t('stats', { w: wpm, a: acc, c: maxCombo });
  if (win && (!save.best[world] || tt < save.best[world])) {
    save.best[world] = Math.round(tt * 100) / 100; showBest(); m += t('gap') + t('newBest');
    if (world === 0) keep('typing-game.bestTime2', save.best[0]);
  }
  played = true;
  if (win && world === save.unlocked - 1 && world < WORLDS.length - 1) {
    save.unlocked++; sel = nextWorld = world + 1; m += t('gap') + t('unlock', { w: world + 2 });
  } else if (win && world === WORLDS.length - 1) m += t('gap') + t('allClear');
  save.world = sel; store();
  const fresh = award({ win, t: tt, hearts, stage, maxCombo, acc, world, hurts });
  if (fresh.length) { m += t('gap') + t('newBadge', { n: fresh.join(t('sep')) }); setTimeout(() => sfx('badge'), 900); }
  say(m); sfx(win ? 'win' : 'lose');
  if (nextWorld >= 0) view(nextWorld); else showWorlds();
  $('worlds').hidden = false;
  // a held or quick key must not throw the result away: the buttons wake up after a moment
  const b = $('start');
  b.hidden = false; b.disabled = true;
  setTimeout(() => { b.disabled = false; b.focus(); }, 800);
}

/* ---------- world picker ---------- */
function showWorlds() {
  $('worlds').innerHTML = WORLDS.map((w, i) => {
    const locked = i >= unlocked(), info = locked ? t('lockedW') : fmt(save.best[i]);
    return `<button type="button" data-w="${i}" aria-pressed="${i === sel}" ${locked ? 'disabled' : ''}
      aria-label="${t('world', { w: i + 1, n: t(w.name) })}${t('comma')}${info}" title="${t(w.name)}"><b>${i + 1}</b><small>${info}</small></button>`;
  }).join('');
  $('hint').textContent = t(unlocked() > 1 ? 'anyKey2' : 'anyKey');
  $('start').textContent = t(sel === nextWorld ? 'next' : played ? 'again' : 'start');
}
// select a world (doesn't start it) and show its first level
function view(i) {
  sel = Math.max(0, Math.min(unlocked() - 1, i));
  world = sel; stage = 0; hp = S().hp; raged = false; dead = false; fx = {};
  SCENES[S().scene](false); hud(); showBest(); showWorlds();
}
function pick(i) {
  if (running) return;
  view(i);
  say(t('pickMsg', { w: sel + 1, n: t(WORLDS[sel].name), b: fmt(save.best[sel]) }));
}
$('worlds').onclick = e => { const b = e.target.closest('[data-w]'); if (b && !b.disabled) pick(+b.dataset.w); };

$('start').onclick = () => {
  if (running) return;
  audio(); // the click (or key) unlocks sound
  world = sel; save.world = sel; store(); nextWorld = -1;
  stage = 0; hearts = 3; hurts = 0; combo = maxCombo = keys = typos = good = 0;
  used.clear(); bag = []; bagKey = ''; floats = []; fx = {}; dead = false; runId++;
  running = playing = true; t0 = now(); pausedTotal = 0; pausedAt = 0;
  $('start').hidden = true; $('worlds').hidden = true;
  $('input').disabled = false;
  $('input').focus();
  showBest();
  loadStage();
};
// keys before a run: arrows move the world selection, 1-3 pick and start that world, anything else starts the
// selected one. Tab, modifier keys and shortcuts are left alone.
document.addEventListener('keydown', e => {
  const b = $('start');
  if (running || b.hidden || b.disabled || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (['Tab', 'Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Escape'].includes(e.key)) return;
  if (e.target.closest('input, textarea, select, [contenteditable]')) return; // e.g. the site top bar's reminder box
  if (!e.target.closest('#snd, #badges') || !['Enter', ' '].includes(e.key)) e.preventDefault(); // the key must not land in the input as a first letter (or click a button a second time)
  const dir = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key];
  if (dir) return pick(sel + dir);
  const wb = e.target.closest('[data-w]');
  if (!wb && e.target.closest('button') && e.target !== b && (e.key === 'Enter' || e.key === ' ')) return; // ♪ and badges keep their own Enter/Space
  if (wb && (e.key === 'Enter' || e.key === ' ')) pick(+wb.dataset.w);
  const n = /^[1-9]$/.test(e.key) ? +e.key - 1 : -1;
  if (n >= 0 && n < WORLDS.length) {
    if (n >= unlocked()) { sfx('typo'); return say(t('lockedMsg', { w: n + 1, p: n })); }
    pick(n);
  }
  b.click();
});

// letters are checked as they are typed: a wrong letter is refused (no heart lost, combo resets),
// and the attack fires as soon as the word is complete
function onType() {
  const el = $('input');
  if (!playing || !word) { el.value = done; return; }
  const v = el.value.replace(/\s/g, '').toLowerCase();
  if (v.length > done.length) {
    keys++;
    if (!word.startsWith(v)) {
      typos++; clean = false; combo = 0; hud(); sfx('typo');
      const w = $('word'); w.classList.remove('bad'); void w.offsetWidth; w.classList.add('bad');
      el.value = done; return;
    }
    good += v.length - done.length; sfx('key', v.length);
  }
  done = word.startsWith(v) ? v : done;
  el.value = done; renderWord();
  if (done === word) hit();
}
$('input').addEventListener('input', e => { if (!e.isComposing) onType(); });
$('input').addEventListener('compositionend', onType);
$('form').onsubmit = e => e.preventDefault();
// switching tabs pauses the run instead of draining hearts
document.addEventListener('visibilitychange', () => {
  if (document.hidden && playing) { playing = false; pausedAt = now(); fx.away = true; }
  else if (!document.hidden && fx.away) {
    fx.away = false; const d = now() - pausedAt;
    pausedTotal += d; wordStart += d; pausedAt = 0; playing = true;
  }
});

/* ---------- frame loop: timer and scene ---------- */
for (let i = 0; i < 10; i++) $('tbar').appendChild(document.createElement('i'));
const blocks = [...$('tbar').children];
function frame() {
  const n = now(), s = S();
  if (playing && word) {
    const left = 1 - (n - wordStart) / (limit * 1000);
    if (left <= 0) hurt();
    else {
      const on = Math.ceil(left * 10);
      blocks.forEach((b, i) => b.classList.toggle('on', i < on));
      $('tbar').className = left < .3 ? 'low' : left < .5 ? 'mid' : '';
      if (left < .3) { const q = Math.ceil((n - wordStart) / 500); if (q !== lastWarn) { lastWarn = q; sfx('warn'); } }
    }
  } else if (!running) blocks.forEach(b => b.classList.remove('on'));
  if (running) $('time').textContent = runTime().toFixed(1);

  const step = Math.floor(n / 125);
  const shake = fx.shake && n - fx.shake < 300 ? (step % 2 ? 1 : -1) * (s.boss ? 2 : 1) : 0;
  g.setTransform(1, 0, 0, 1, shake, 0);
  g.drawImage(bgc, 0, 0);
  const sf = SCENE_FX[s.scene] || {}, fire = raged && sf.rageFire || sf.fire || FIRE;
  (sf.flames || []).forEach(([x, y]) => {
    const fl = step % 2; px(g, x, y + 1, fire[0]); px(g, x, y + 2, fire[0]); px(g, x - fl, y, fire[1]); px(g, x + 1 - fl, y + 1, fire[1]);
  });
  if (sf.motes) MOTES.forEach(([x, y], i) => { if ((step + i * 3) % 7 < 4) px(g, x, y, sf.motes); });

  // hero: breathes, winds up, dashes in, comes back; flashes red when hit
  const a = fx.atk ? (n - fx.atk) / 1000 : 9;
  let hx = 16;
  if (a < .1) hx = 15; else if (a < .22) hx = 16 + Math.round((a - .1) / .12 * 22); else if (a < .36) hx = 38 - Math.round((a - .22) / .14 * 22);
  const hurtOn = fx.hurt && n - fx.hurt < 220;
  sprite(g, HERO, HERO_PAL, hx, FLOOR - 12, { liftRows: Math.floor(n / 600) % 2 ? 6 : 0, solid: hurtOn && step % 2 ? '#ef4444' : null });

  // monster: idles, flashes and is knocked back on a hit, melts when killed
  const mon = MONSTERS[s.mon], idle = mon.idle, boss = !!s.boss, sc = boss ? 2 : 1, map = mon.map;
  const mw = 12 * sc, mh = map.length * sc;
  const k = fx.kill ? (n - fx.kill) / 600 : -1, melting = dead && k >= 0 && k < 1;
  if (!dead || melting) {
    const pal = palOf(s), flash = a > .12 && a < .26;
    let mx = (boss ? 74 : 80) + (hurtOn ? -6 : 0) + (flash ? 2 : 0), my = FLOOR - mh - (idle.hover || 0) * sc;
    const o = { scale: sc }, ph = idle.p ? Math.floor(n / idle.p) : 0;
    if (!melting) {
      if (idle.t === 'squash' && ph % 2) { my += 1; o.fromRow = 1; }
      if (idle.t === 'hop' && ph % 2) my -= 1;
      if (idle.t === 'breathe' && ph % 2) o.liftRows = idle.lift;
      if (idle.t === 'float') my -= idle.seq[ph % idle.seq.length] * sc;
      if (idle.t === 'sway') mx += ph % 2 ? 1 : -1;
    }
    if (melting) {
      const cut = Math.floor(k * map.length);
      sprite(g, map, pal, mx, my + cut * sc, { scale: sc, fromRow: cut });
      [[2, -2], [6, -5], [10, -3]].forEach(([dx, dy], i) => { if ((step + i) % 2) px(g, mx + dx * sc, FLOOR + dy - Math.round(k * 6), '#fff'); });
    } else {
      if (mon.rim) for (let y = 8; y < mh - 2; y++) px(g, mx - 1, my + y, mon.rim); // rim light so the boss reads on the wall
      sprite(g, map, pal, mx, my, { ...o, solid: flash && step % 2 === 0 ? mon.flash || '#fff' : null });
      if (s.shine && Math.floor(n / 2000) % 2 === 0) { // metal shine
        const sx = Math.floor((n % 2000) / 2000 * 14) - 1;
        for (let y = 2; y < map.length - 1; y++) if (map[y][sx] === 'm') px(g, mx + sx, my + y, '#fff');
      }
      if (flash) for (let i = 0; i < mw + 4; i++) px(g, mx - 2 + i, my + mh - 2 - Math.round(i * (mh - 4) / (mw + 4)), '#fff');
      if (running) {
        const bw = boss ? 30 : 24, bx = mx + (mw - bw) / 2 | 0, by = my - (boss ? 7 : 5);
        rect(g, bx - 1, by - 1, bw + 2, 5, '#000'); rect(g, bx, by, bw, 3, '#3a3352');
        rect(g, bx, by, Math.round(bw * hp / s.hp), 3, boss ? '#ef4444' : '#f38ba8');
      }
    }
  }
  for (let i = 0; i < 3; i++) sprite(g, HEART, { k: i < hearts ? '#f38ba8' : '#3a3352' }, 2 + i * 7, 2);
  floats = floats.filter(f => n - f.t < 700);
  floats.forEach(f => text(g, f.str, f.x, f.y - Math.round((n - f.t) / 700 * 8), f.col));
  requestAnimationFrame(frame);
}

SCENES[S().scene](false);
hud(); showBest(); showWorlds();
say(t('intro'));
fit();
addEventListener('resize', fit);
requestAnimationFrame(frame);
// keyboard popping up shrinks the visual viewport: drop to 2x and keep scene, word and input in view
if (window.visualViewport) visualViewport.addEventListener('resize', () => {
  fit();
  if (document.activeElement === $('input')) cv.scrollIntoView({ block: 'start' });
});
</script>
</body>
</html>
