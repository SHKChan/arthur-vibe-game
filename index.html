<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arthur 的打字游戏 · Vibe Game</title>
<style>
  :root { --bg: #000; --fg: #fff; --hit: #f38ba8; --ok: #a6e3a1; }
  body { font-family: "Courier New", monospace; font-weight: bold; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; max-width: 560px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  .win { border: 4px double var(--fg); border-radius: 8px; padding: 10px 14px; width: 100%; box-sizing: border-box; background: #000; }
  .bar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  #hearts { color: var(--hit); letter-spacing: 2px; }
  #field { display: flex; justify-content: space-around; align-items: flex-end; width: 100%; min-height: 160px; background: linear-gradient(#1a3a8a 60%, #2d6a2d 60%); border-radius: 8px; padding: 12px 0; }
  canvas { image-rendering: pixelated; }
  #hero { width: 96px; }
  #mon { width: 120px; }
  #hpbar { height: 10px; border: 2px solid var(--fg); margin-top: 6px; }
  #hpfill { height: 100%; background: var(--hit); transition: width .15s; }
  #word { font-size: 2.2rem; letter-spacing: 3px; text-align: center; min-height: 2.6rem; }
  #word .ok { color: var(--ok); }
  input { font: inherit; font-size: 1.4rem; padding: .4rem; text-align: center; border: 4px double var(--fg); border-radius: 8px; background: #000; color: var(--fg); width: 100%; box-sizing: border-box; }
  button { font: inherit; font-size: 1.2rem; padding: .5rem 1.5rem; border: 4px double var(--fg); border-radius: 8px; background: #000; color: var(--fg); cursor: pointer; }
  button:hover, button:focus-visible { background: var(--fg); color: #000; }
  .shake { animation: shake .2s; }
  .flash { animation: flash .2s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes flash { 50% { opacity: .2; } }
</style>
<script src="/nav.js" defer></script>
</head>
<body>
<main>
  <div class="win bar">
    <span>STAGE <b id="stage">1</b>/5</span>
    <span id="hearts" aria-label="hearts">♥♥♥</span>
    <span>TIME <b id="time">0.0</b>s</span>
    <span>BEST <b id="best">--</b></span>
  </div>
  <div id="field">
    <canvas id="hero" aria-label="hero"></canvas>
    <div><canvas id="mon" aria-label="monster"></canvas><div id="hpbar"><div id="hpfill" style="width:100%"></div></div></div>
  </div>
  <div class="win" id="msg" aria-live="polite">A wild monster appears! Type to attack. Wrong key = lose a heart.</div>
  <div id="word"></div>
  <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the word" disabled>
  <button id="start">Start</button>
</main>
<script>
const WORDS = ('cat dog sun hat cup map bat egg fox owl red sky ' +
  'fire gold king ring moon star lake wind rock tree bell door ' +
  'sword magic slime metal tower night stone flame heart ghost ' +
  'dragon wizard castle shield potion knight forest silver hammer spirit ' +
  'monster thunder dungeon crystal warrior phoenix kingdom lantern blizzard treasure ' +
  'adventure legendary labyrinth sorcerer champion explosion invisible').split(' ');
// each stage: longer words, more HP
const STAGES = [
  { name: 'Slime',       color: '#4ade80', min: 3, max: 4, hp: 20, scale: 1 },
  { name: 'She-Slime',   color: '#fb923c', min: 4, max: 5, hp: 30, scale: 1 },
  { name: 'Metal Slime', color: '#cbd5e1', min: 5, max: 6, hp: 45, scale: 1.1 },
  { name: 'Night Slime', color: '#a855f7', min: 6, max: 8, hp: 60, scale: 1.2 },
  { name: 'King Slime',  color: '#facc15', min: 7, max: 9, hp: 80, scale: 1.4 },
];
const HERO = ['....yyyy....','...yyyyyy...','...ssssss...','...sbssbs...','...ssssss...','..rrbbbbrr..',
  '.wrbbbbbbr..','.w.bbbbbb.s.','.w.bbbbbb...','...gg..gg...','...gg..gg...','..kkk..kkk..'];
const SLIME = ['.....kk.....','....kmmk....','...kmmmmk...','..kmwmmmmk..','.kmwmmmmmmk.','.kmmkmmkmmk.',
  'kmmmkmmkmmmk','kmmmmmmmmmmk','kmmmmmmmmmmk','.kkkkkkkkkk.'];
const $ = id => document.getElementById(id);

function draw(c, map, pal) {
  c.width = map[0].length; c.height = map.length;
  const g = c.getContext('2d');
  map.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
}
draw($('hero'), HERO, { y: '#facc15', s: '#fcd9b6', b: '#2563eb', r: '#dc2626', w: '#e5e7eb', g: '#78350f', k: '#1f2937' });

let stage, hp, hearts, word, done, t0, timer, playing = false;
let best = null;
try { best = parseFloat(localStorage.getItem('arthur.bestTime')) || null; } catch {}
const showBest = () => $('best').textContent = best ? best.toFixed(1) + 's' : '--';
showBest();

function bump(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function loadStage() {
  const s = STAGES[stage];
  hp = s.hp;
  draw($('mon'), SLIME, { k: '#111', m: s.color, w: '#fff' });
  $('mon').style.width = 120 * s.scale + 'px';
  $('stage').textContent = stage + 1;
  $('msg').textContent = `A ${s.name} appears! (HP ${s.hp})`;
  updateHp();
  nextWord();
}
function nextWord() {
  const s = STAGES[stage], pool = WORDS.filter(w => w.length >= s.min && w.length <= s.max);
  word = pool[Math.floor(Math.random() * pool.length)];
  done = '';
  $('input').value = '';
  renderWord();
}
function renderWord() { $('word').innerHTML = `<span class="ok">${done}</span>${word.slice(done.length)}`; }
function updateHp() { $('hpfill').style.width = 100 * hp / STAGES[stage].hp + '%'; }

function end(win) {
  playing = false;
  clearInterval(timer);
  $('input').disabled = true;
  $('start').textContent = 'Play again';
  const t = (performance.now() - t0) / 1000;
  if (win) {
    $('msg').textContent = `You defeated the King Slime in ${t.toFixed(1)}s! The kingdom is saved!`;
    if (!best || t < best) { best = t; showBest(); try { localStorage.setItem('arthur.bestTime', t); } catch {} }
  } else {
    $('msg').textContent = `You have been defeated at stage ${stage + 1}...`;
  }
  $('start').focus();
}

$('start').onclick = () => {
  stage = 0; hearts = 3; playing = true;
  $('hearts').textContent = '♥♥♥';
  $('input').disabled = false;
  $('input').focus();
  loadStage();
  t0 = performance.now();
  clearInterval(timer);
  timer = setInterval(() => $('time').textContent = ((performance.now() - t0) / 1000).toFixed(1), 100);
};

// compare whole value so it works with mobile keyboards too
$('input').oninput = e => {
  if (!playing) return;
  const typed = e.target.value.toLowerCase();
  if (typed.length <= done.length) { e.target.value = done; return; } // ignore backspace
  for (const ch of typed.slice(done.length)) {
    if (ch === word[done.length]) {
      done += ch; hp--;
      bump($('mon'), 'flash');
      updateHp();
      if (hp <= 0) {
        if (++stage >= STAGES.length) return end(true);
        return loadStage();
      }
      if (done === word) return nextWord();
    } else {
      hearts--;
      $('hearts').textContent = '♥'.repeat(hearts) + '♡'.repeat(3 - hearts);
      bump($('hero'), 'shake');
      $('msg').textContent = `Ouch! The ${STAGES[stage].name} hits you!`;
      if (hearts <= 0) return end(false);
      break;
    }
  }
  e.target.value = done;
  renderWord();
};
</script>
</body>
</html>
